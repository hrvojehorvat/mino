[project]
name = "mino-llm-explain"
version = "0.1.0"
description = "Mino Phase 4 LLM explanation service — turns a batch's MLResult metrics into a plain-language explanation, guardrailed against diagnostic language"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "vllm>=0.6",
    "modal>=0.64",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: real-model generation tests — slow, requires vLLM + a GPU. Excluded from the default run.",
]
addopts = "-m 'not gpu'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mino_llm"]
